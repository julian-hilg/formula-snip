[package]
name = "formula-snip"
version = "0.1.0"
edition = "2021"
description = "Snip any formula on screen and get LaTeX in your clipboard. Local, offline OCR via marker/surya."
license = "MIT"
readme = "README.md"
keywords = ["latex", "ocr", "math", "screenshot", "mathpix"]
categories = ["gui", "science"]

[dependencies]
anyhow = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
arboard = { version = "3", features = ["image-data"] }
dirs = "5"
eframe = "0.29"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleEventManager", "NSAppleEventDescriptor"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
